name: rheinblick-portal

services:
  reverse-proxy:
    image: ${NGINX_IMAGE}
    build:
      context: ./nginx
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HTTP_PORT}:80"
      - "127.0.0.1:${HTTPS_PORT}:443"
    volumes:
      - nginx_logs:/var/log/nginx
    networks:
      - frontend_net
    depends_on:
      portal:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:80/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      de.rheinblick.project: "unternehmensportal"
      de.rheinblick.owner: "it-betrieb"
      de.rheinblick.component: "reverse-proxy"

  portal:
    image: ${WORDPRESS_IMAGE}
    restart: unless-stopped
    environment:
      WORDPRESS_DB_HOST: database:3306
      WORDPRESS_DB_NAME: ${MARIADB_DATABASE}
      WORDPRESS_DB_USER: ${MARIADB_USER}
      WORDPRESS_DB_PASSWORD_FILE: /run/secrets/db_user_password
    secrets:
      - db_user_password
    volumes:
      - portal_data:/var/www/html
      - ./healthchecks/portal_healthcheck.sh:/usr/local/bin/portal_healthcheck.sh:ro
    networks:
      - frontend_net
      - backend_net
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "/usr/local/bin/portal_healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1024M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      de.rheinblick.project: "unternehmensportal"
      de.rheinblick.owner: "it-betrieb"
      de.rheinblick.component: "portal"

  database:
    image: ${MARIADB_IMAGE}
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${MARIADB_DATABASE}
      MARIADB_USER: ${MARIADB_USER}
      MARIADB_ROOT_PASSWORD_FILE: /run/secrets/db_root_password
      MARIADB_PASSWORD_FILE: /run/secrets/db_user_password
    secrets:
      - db_root_password
      - db_user_password
    volumes:
      - db_data:/var/lib/mysql
      - ./healthchecks/database_healthcheck.sh:/usr/local/bin/database_healthcheck.sh:ro
    networks:
      - backend_net
    healthcheck:
      test: ["CMD-SHELL", "/usr/local/bin/database_healthcheck.sh"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1024M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      de.rheinblick.project: "unternehmensportal"
      de.rheinblick.owner: "it-betrieb"
      de.rheinblick.component: "database"

networks:
  frontend_net:
    driver: bridge
  backend_net:
    driver: bridge
    internal: true

volumes:
  db_data:
  portal_data:
  nginx_logs:

secrets:
  db_root_password:
    file: ./secrets/db_root_password.txt
  db_user_password:
    file: ./secrets/db_user_password.txt
