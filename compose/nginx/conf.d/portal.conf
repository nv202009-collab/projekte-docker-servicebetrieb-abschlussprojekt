server {
    listen 80;
    server_name portal.rheinblick.test;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name portal.rheinblick.test;

    ssl_certificate /etc/nginx/certs/portal.rheinblick.test.crt;
    ssl_certificate_key /etc/nginx/certs/portal.rheinblick.test.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    client_max_body_size 64M;

    resolver 127.0.0.11 valid=30s ipv6=off;

    error_page 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }

    location / {
        set $portal_upstream http://portal:80;
        proxy_pass $portal_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }
}
